<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Countdown</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #fdfdfd;
      color: #333;
      text-align: center;
      min-height: 100vh;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    .day {
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: #555;
    }
    .message {
      font-size: 1.4rem;
      margin: 20px 0;
    }
    img {
      max-width: 100%;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <h1>Countdown to Your Birthday 🎉</h1>
  <div class="day" id="dayText">Loading...</div>
  <div class="message" id="message">Please wait...</div>
  <div id="photoContainer"></div>

  <script>
    const START_DATE = new Date("2024-07-21");
    const END_DATE = new Date("2024-12-17");

    const messages = {
      1: "Hey love, our countdown begins today 💫",
      2: "You’re my sunshine on every cloudy day ☀️",
      3: "Every heartbeat says your name ❤️",
      4: "You make my world beautiful 🌍",
      5: "Missing you more with every day 🕊️",
      6: "Your smile is my favourite thing 😍",
      7: "You're the reason I believe in love ✨"
      // Add more messages here...
    };

    const images = {
      1: "https://drive.google.com/file/d/1dNlmyfQpCGfqpnEZfBrlqBfeMlbEfyTR/view?usp=drivesdk",
      2: "https://example.com/image2.jpg",
      3: "https://example.com/image3.jpg"
      // Add more image URLs here, use actual links
    };

    function getCurrentDay() {
      const today = new Date();
      const diffTime = today - START_DATE;
      const dayNumber = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
      const maxDays = Math.floor((END_DATE - START_DATE) / (1000 * 60 * 60 * 24)) + 1;
      return Math.max(1, Math.min(dayNumber, maxDays));
    }

    function showTodayContent() {
      const day = getCurrentDay();
      document.getElementById("dayText").textContent = `Day ${day}`;

      const msg = messages[day] || "I love you more with every passing day 💖";
      document.getElementById("message").textContent = msg;

      const container = document.getElementById("photoContainer");
      container.innerHTML = ""; // Clear old content

      const imageUrl = images[day];
      if (imageUrl) {
        const img = document.createElement("img");
        img.src = imageUrl;
        img.alt = `Day ${day} photo`;
        container.appendChild(img);
      } else {
        container.textContent = "No image uploaded yet 📷";
      }
    }

    showTodayContent();
  </script>
</body>
</html>
