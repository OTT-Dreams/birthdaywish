<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎂 Countdown to Her Birthday</title>
  <style>
    :root {
      --bg: linear-gradient(145deg, #f6d4ec, #d0e8f2);
      --text: #333;
      --accent: #ff6f91;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: var(--text);
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 5px;
      color: var(--accent);
    }

    .day {
      font-size: 1.2rem;
      margin-bottom: 15px;
    }

    .message {
      font-size: 1.4rem;
      margin: 25px 0;
      max-width: 90%;
      color: #444;
    }

    img {
      max-width: 90vw;
      max-height: 70vh;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
      transition: transform 0.3s;
    }

    img:hover {
      transform: scale(1.02);
    }

    .footer {
      margin-top: 40px;
      font-size: 0.9rem;
      color: #777;
    }
  </style>
</head>
<body>
  <h1>💖 Countdown to Your Day</h1>
  <div class="day" id="dayText">Loading...</div>
  <div class="message" id="message">Fetching love note...</div>
  <div id="photoContainer"></div>
  <div class="footer">Every day is special — just like you 💫</div>

  <script>
    const START_DATE = new Date("2024-07-21");
    const END_DATE = new Date("2024-12-17");

    const messages = {
      1: "Hey love, our countdown begins today 💫",
      2: "You’re my sunshine on every cloudy day ☀️",
      3: "Every heartbeat says your name ❤️",
      4: "You make my world beautiful 🌍",
      5: "Missing you more with every day 🕊️",
      6: "Your smile is my favourite thing 😍",
      7: "You're the reason I believe in love ✨",
      8: "Counting days, counting blessings 💝",
      9: "You’re my always and forever 💍",
      10: "A little closer to your special day 🎈",
      // Add more...
    };

    const getCurrentDay = () => {
      const today = new Date();
      const diff = today - START_DATE;
      const totalDays = Math.floor((END_DATE - START_DATE) / (1000 * 60 * 60 * 24)) + 1;
      const currentDay = Math.floor(diff / (1000 * 60 * 60 * 24)) + 1;
      return Math.max(1, Math.min(currentDay, totalDays));
    };

    const showTodayContent = () => {
      const day = getCurrentDay();
      document.getElementById("dayText").textContent = `Day ${day}`;

      const msg = messages[day] || "I love you more with every passing day 💖";
      document.getElementById("message").textContent = msg;

      const container = document.getElementById("photoContainer");
      container.innerHTML = "";

      const image = new Image();
      image.src = `https://your-github-username.github.io/your-repo/day${day}.jpg`;
      image.alt = `Photo for Day ${day}`;
      image.onerror = () => container.textContent = "No photo uploaded yet 📷";
      container.appendChild(image);
    };

    showTodayContent();
  </script>
</body>
</html>
